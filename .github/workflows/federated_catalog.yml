name: Federated Architecture Catalog

on:
  push:
    branches: [ "main" ]
    paths:
      - 'c4-catalogs/**'
      - 'scripts/**'
      - '.github/workflows/federated_catalog.yml'
  workflow_dispatch:

jobs:
  build_job:
    name: Build & Aggregate Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Resolves to https://<owner>.github.io/<repo>
      PAGES_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
    steps:
      - name: Install Graphviz
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz unzip
          
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Restore Cached Workspace Builds
        uses: actions/cache@v6
        with:
          path: ./public
          key: catalog-cache-${{ hashFiles('c4-catalogs/**/*.dsl') }}
          restore-keys: |
            catalog-cache-

      - name: Build Catalogs & Generate Portal
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Upload to Pipeline Artifact Store
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy_job:
    name: Deploy to GitHub Pages
    needs: build_job
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish Unified Catalog to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
