name: Federated Architecture Catalog

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_job:
    name: Build & Aggregate Catalog
    runs-on: ubuntu-latest
    # Minimum required to read the repository and execute the scripts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Incremental Cache
        uses: actions/cache@v6
        with:
          path: ./public
          key: catalog-cache-${{ hashFiles('c4-catalogs/**/*.dsl') }}
          restore-keys: |
            catalog-cache-

      - name: Build Catalogs & Generate Portal
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Upload to Pipeline Artifact Store
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy_job:
    name: Deploy to GitHub Pages
    needs: build_job
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Strict rights exclusively for exchanging the OIDC token and publishing
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish Unified Catalog to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
