name: Gated Static Delivery Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  build_job:
    name: Build Job Runner
    runs-on: ubuntu-latest
    # Job-level permissions: Only the minimum required to read the repository
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Fetch, Verify, and Install Structurizr CLI
        run: |
          curl -L -o /tmp/structurizr_cli.zip "https://github.com/structurizr/cli/releases/download/v2025.11.09/structurizr-cli.zip"
          
          # Supply chain verification
          echo "f5365a463fc44d539ed19bec00c48ba1e1ecda0ccfd1ba40d2e7472d264eb79a  /tmp/structurizr_cli.zip" | sha256sum -c -
          
          mkdir -p /tmp/structurizr_cli
          unzip /tmp/structurizr_cli.zip -d /tmp/structurizr_cli
          chmod +x /tmp/structurizr_cli/structurizr.sh


      - name: Compile Static Site Artifacts (Network Isolated)
        run: |
          # unshare -r -n maps the current user to root in a new user namespace 
          # and creates a new, empty network namespace (disabling internet access).
          sudo unshare -n sudo -E -u $USER /tmp/structurizr_cli/structurizr.sh export -workspace main-workspace.dsl -format StaticSite -output ./build
        
      - name: Upload to Pipeline Artifact Store
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy_job:
    name: Deploy Job Runner
    needs: build_job
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish Static Bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
